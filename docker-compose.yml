services:
  postgres-db:
    image: postgres:17-alpine
    container_name: modelcompass-postgres
    environment:
      POSTGRES_DB: modelcompass
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  model-compass-api:
    build: .
    container_name: modelcompass-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/modelcompass
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  pgdata: